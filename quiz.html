<!DOCTYPE html>
<html lang="lt">
<head>
  <!-- Pagrindiniai meta duomenys -->
  <meta charset="UTF-8">
  <title>Matematikos užduotys</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fono skaičių efektas -->
  <div class="numbers" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card">
      <!-- Puslapio pavadinimas -->
      <h1>Matematikos užduotys</h1>

      <!-- Taškų skaitiklis -->
      <p class="small">
        Taškai: <span id="score">0</span>
      </p>

      <!-- Lygio pasirinkimas -->
      <div class="row" style="margin:8px 0; align-items:center;">
        <label for="levelSelect" class="small muted" style="margin-right:8px;">Lygis:</label>
        <select id="levelSelect" class="input" style="width:auto; max-width:220px;">
          <option value="patenkinamas">Patenkinamas</option>
          <option value="vidutinis">Vidutinis</option>
          <option value="aukstesnysis">Aukštesnysis</option>
        </select>
      </div>

      <!-- Čia JS įrašo einamą užduotį -->
      <p id="question" class="expression"></p>

      <!-- Vartotojo atsakymo įvedimas (tekstas, kad priimtų trupmenų formatus) -->
      <input
        type="text"
        id="answer"
        class="input"
        placeholder="Įvesk atsakymą (pvz. 1/3 arba 1--3)"
      >

      <!-- (trupmenų pavyzdys pašalintas pagal prašymą) -->

      <!-- Mygtukas tikrina atsakymą ir pereina į kitą klausimą -->
      <div class="row gap buttons">
        <button id="nextBtn" class="btn primary">Kitas</button>
      </div>

      <!-- Pranešimų vieta (pvz., kai neįvestas atsakymas) -->
      <p id="result" class="feedback"></p>

      <!-- Rezultatų blokas (rodomas tik testo pabaigoje) -->
      <section id="resultScreen" class="hidden results">
        <h2>Rezultatai</h2>
        <p id="finalScore" class="results__score"></p>
        <p id="repeatHint" class="results__hint"></p>
        <div class="row gap">
          <button id="fixMistakesBtn" class="btn primary hidden">Ištaisyti klaidas</button>
        </div>
        <div class="results__list">
          <h3>Klaidų peržiūra</h3>
          <div id="mistakes"></div>
        </div>
      </section>
    </section>
  </main>

  <!-- Pagrindinė logika -->
  <script src="quiz.js"></script>
</body>
</html>
